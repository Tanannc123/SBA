spring.application.name=A2_tanan_ce191123
server.port=8080

# Create the database first in SQL Server: CREATE DATABASE A2_tanan_ce191123;
# Set DB_USERNAME and DB_PASSWORD for your local SQL Server login.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A2_tanan_ce191123;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Spring Data JPA creates/updates the tables from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
